[project]
name = "retail-bank-data-warehouse"
version = "0.1.0"
description = "Retail bank data warehouse built on the public Berka (PKDD'99) dataset"
requires-python = ">=3.11"
dependencies = ["sqlalchemy>=2.0", "pymysql>=1.1", "pyarrow>=15", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: checks the real files in data/raw (skipped if they are missing)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
